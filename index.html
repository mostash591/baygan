*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
font-family:var(--font);color:var(--ink);font-size:14px;line-height:1.8;overflow-x:hidden;
background:
radial-gradient(900px 480px at 92% -8%, var(--glow1), transparent 60%),
radial-gradient(800px 520px at -8% 108%, var(--glow2), transparent 60%),
repeating-linear-gradient(0deg, transparent 0 31px, var(--gridline) 31px 32px),
repeating-linear-gradient(90deg, transparent 0 31px, var(--gridline) 31px 32px),
var(--bg);
transition:background .3s,color .3s;
}
[hidden]{display:none!important}
button{font-family:inherit}
svg{display:block;flex:none;width:16px;height:16px}
::selection{background:rgba(161,140,229,.35)}
:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(107,85,186,.35);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}
mark{background:var(--markbg);color:var(--markink);border-radius:4px;padding:0 2px}
.empty{color:var(--ink2);opacity:.6}
.hint{color:var(--ink2);font-size:12.5px}
.colgap{display:flex;flex-direction:column;gap:12px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:11px;border:1px solid transparent;font:600 14px var(--font);cursor:pointer;transition:.18s;background:var(--elevated);color:var(--ink);white-space:nowrap}
.btn:hover{transform:translateY(-1px);filter:brightness(1.06)}
.btn:active{transform:translateY(0)}
.btn-primary{background:var(--brand);color:#fff}
.btn-primary:hover{background:var(--hover)}
.btn-accent{background:linear-gradient(135deg,var(--accent),var(--hover));color:#fff;box-shadow:0 6px 18px var(--glowshadow)}
.btn-accent:hover{background:var(--hover)}
.btn-danger{background:var(--err);color:#fff}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{background:var(--elevated)}
.btn.big{padding:12px 20px;font-size:15px}
.btn.small{padding:5px 12px;font-size:12.5px;border-radius:9px}
.btn.active{background:var(--hover);color:#fff;border-color:var(--hover)}
.btn.recording{opacity:.55}
.iconbtn{width:34px;height:34px;border-radius:9px;border:none;background:transparent;color:inherit;display:grid;place-items:center;cursor:pointer;transition:.15s}
.iconbtn:hover{background:var(--tint-soft)}
.iconbtn.warn:hover{background:var(--errbg);color:var(--err)}
.iconbtn svg,.btn svg,.tact svg{width:16px;height:16px}
.inp{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--inpbg);font:inherit;color:var(--ink);transition:border .15s,box-shadow .15s}
.inp:focus{border-color:var(--hover);box-shadow:0 0 0 3px var(--ringbg);outline:none}
.inp::placeholder{color:var(--ink2);opacity:.7}
textarea.inp{resize:vertical;min-height:90px}
.flab{font-weight:700;font-size:13.5px;display:flex;gap:6px;align-items:center}
.flab svg{width:15px;height:15px;color:var(--brandglow)}
.ftag{font-size:11px;background:var(--elevated);border:1px solid var(--line);color:var(--chipink);padding:1px 8px;border-radius:99px;font-weight:600}
.checkrow{display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--ink2);cursor:pointer}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}
.chkrow{display:flex;gap:10px;align-items:center;font-size:14px;cursor:pointer;font-weight:600}
.chkrow input{width:20px;height:20px;accent-color:var(--ok)}
.chkrow.small{font-size:12.5px;gap:6px;font-weight:600}
.chk{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);background:var(--softbg);color:var(--ink2);border-radius:99px;padding:3px 12px;font:700 12px var(--font);cursor:pointer;transition:.15s}
.chk svg{width:14px;height:14px}
.chk:hover{border-color:var(--hover)}
.chk.done{background:rgba(34,197,94,.15);border-color:rgba(34,197,94,.5);color:var(--ok)}
.reqstar{color:var(--err);font-weight:900;margin-inline-start:3px}
.dupwarn{color:var(--warnink);background:var(--warnbg);border:1px solid var(--warnline);border-radius:8px;padding:6px 10px;font-size:12px;margin-top:6px;display:flex;gap:6px;align-items:center}
.dupwarn svg{width:14px;height:14px;flex:none}
.jdate{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.jdate .inp{width:auto;flex:1;min-width:80px}
.jdate .jd-y{flex:0 0 100px;min-width:100px}
.jdate .hint{width:100%}
.fitem{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px;background:var(--softbg)}
.fopts{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:8px}
.fopts .inp{width:auto;min-width:110px}
.errbox{background:var(--errbg);border:1px solid var(--errline);color:var(--errink);padding:9px 12px;border-radius:10px;font-size:13px}
.warnbox{background:var(--warnbg);border:1px solid var(--warnline);color:var(--warnink);padding:12px 14px;border-radius:10px;font-size:13px;display:flex;gap:10px;align-items:flex-start}
.warnbox svg{width:18px;height:18px;flex:none;margin-top:3px}
.linkbtn{background:none;border:none;color:var(--hover);font:600 13px var(--font);cursor:pointer;margin-top:16px;display:inline-flex;gap:6px;align-items:center}
.linkbtn:hover{text-decoration:underline}
.linkbtn svg{width:15px;height:15px}
.sbar{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.sbar i{display:block;height:100%;width:0;border-radius:99px;transition:.3s;background:var(--err)}
.sbar i.lv2{background:var(--warn)}
.sbar i.lv3,.sbar i.lv4{background:var(--ok)}
.pwbox .pwinp{position:relative}
.pwinp .inp{padding-inline-end:46px}
.pw-eye{position:absolute;inset-inline-end:6px;top:50%;transform:translateY(-50%);width:32px;height:32px;border:none;border-radius:8px;background:transparent;color:var(--ink2);display:grid;place-items:center;cursor:pointer;transition:.15s}
.pw-eye:hover{background:var(--tint-soft);color:var(--ink)}
.pw-eye svg{width:17px;height:17px}
.pwtools{display:flex;gap:10px;align-items:center;margin-top:8px;flex-wrap:wrap}
.pwbar{flex:1;height:5px;background:var(--line);border-radius:99px;overflow:hidden;min-width:70px;max-width:150px}
.pwbar i{display:block;height:100%;width:0;background:var(--err);transition:.25s;border-radius:99px}
.pwbar i.lv2{background:var(--warn)}
.pwbar i.lv3,.pwbar i.lv4{background:var(--ok)}
.pwmask{display:inline-flex;align-items:center;gap:7px;flex-wrap:wrap}
.pvdots{font-size:15px;letter-spacing:2px;color:var(--ink);font-weight:700;background:var(--softbg);border:1px solid var(--line);border-radius:8px;padding:2px 10px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.urlval{display:inline-flex;align-items:center;gap:8px;max-width:100%;flex-wrap:wrap}
.urllink{color:var(--hover);text-decoration:none;font-size:13px;font-weight:600;display:inline-flex;gap:6px;align-items:center;max-width:100%;direction:ltr}
.urllink span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.urllink svg{width:14px;height:14px;color:var(--brandglow)}
.urllink:hover{text-decoration:underline;color:var(--glow)}
.mini svg{width:12px;height:12px;display:inline-block;vertical-align:-2px}
.audiowrap{display:flex;flex-direction:column;gap:6px;max-width:340px}
.audiowrap audio{width:100%;height:42px}
.fprev audio{width:100%;max-width:320px;height:42px;margin-top:8px;display:block}
.rtable audio{width:170px;height:36px}
.recstat{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:12.5px;color:var(--err);font-weight:700;flex-wrap:wrap}
.recdot{width:9px;height:9px;border-radius:50%;background:var(--err);display:inline-block;animation:pulse 1.2s infinite}
.moneybox{position:relative}
.moneybox .inp{padding-inline-end:76px}
.moneybox .moneyunit{position:absolute;inset-inline-end:8px;top:50%;transform:translateY(-50%);font-size:11.5px;font-weight:800;color:var(--brandglow);background:var(--elevated);border:1px solid var(--line);padding:2px 9px;border-radius:8px;pointer-events:none;max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.moneyval{font-weight:800;font-size:14px}
.moneyval b{color:var(--brandglow);font-size:11px;background:var(--elevated);border:1px solid var(--line);padding:1px 9px;border-radius:99px;margin-inline-start:5px;font-weight:800}
.timeval{font-weight:800;letter-spacing:.5px}
.bankrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--softbg)}
.bankrow.on{border-color:var(--ok)}
.bk-name{font-weight:800;display:inline-flex;gap:6px;align-items:center}
.bk-name svg{width:15px;height:15px;color:var(--brandglow)}
.bk-acts{display:inline-flex;gap:6px;margin-inline-start:auto;flex-wrap:wrap}
.bankchip{display:inline-flex;align-items:center;gap:6px;background:var(--elevated);border:1px solid var(--line);color:var(--brandglow);font-weight:800;font-size:12.5px;padding:4px 12px;border-radius:99px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bankchip svg{width:14px;height:14px;flex:none}
@media(max-width:640px){.bankchip{max-width:110px;font-size:11px;padding:3px 9px}}
.auth{min-height:100vh;display:grid;grid-template-columns:1.1fr minmax(380px,520px);position:relative}
.theme-btn{position:absolute;top:18px;inset-inline-end:18px;width:42px;height:42px;border-radius:12px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.09);color:#F1EEFD;display:grid;place-items:center;cursor:pointer;z-index:6;transition:.2s}
.theme-btn:hover{background:rgba(255,255,255,.18);transform:translateY(-1px)}
.theme-btn svg{width:19px;height:19px}
.auth-side{background:linear-gradient(200deg,var(--authgrad1),var(--authgrad2) 75%);color:#EAE5FA;padding:52px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.auth-side::before{content:'';position:absolute;inset:-40%;background-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='72' height='72' viewBox='0 0 72 72'><g fill='none' stroke='%23ffffff' stroke-opacity='.06'><rect x='16' y='16' width='40' height='40'/><rect x='16' y='16' width='40' height='40' transform='rotate(45 36 36)'/><circle cx='36' cy='36' r='3'/></g></svg>");animation:drift 90s linear infinite}
.auth-panel{position:relative;max-width:540px}
.auth-logo{display:flex;gap:12px;align-items:center;margin-bottom:34px}
.badge{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,var(--accent),var(--glow));color:#fff;display:grid;place-items:center;box-shadow:0 8px 22px var(--glowshadow)}
.badge svg{width:23px;height:23px}
.auth-logo .nm{font-weight:900;font-size:26px;line-height:1.2}
.auth-logo .sub{font-size:12px;opacity:.75}
.auth h1{font-size:46px;line-height:1.35;font-weight:900}
.auth h1 span{color:var(--glow)}
.auth-lead{opacity:.85;margin:10px 0 26px;font-size:15px}
.featlist{display:flex;flex-direction:column;gap:12px;list-style:none}
.featlist li{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;opacity:.92}
.featlist svg{width:18px;height:18px;color:var(--glow);margin-top:4px}
.auth-legal{font-size:12px;opacity:.8;display:flex;gap:8px;align-items:center;font-weight:700}
.auth-legal svg{width:15px;height:15px}
.treeart{position:absolute;left:8%;bottom:6%;width:240px;height:auto;opacity:.55;animation:bob 6s ease-in-out infinite}
.auth-form{display:grid;place-items:center;padding:34px;background:var(--bg)}
.auth-card{width:100%;max-width:430px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:32px;box-shadow:var(--shadow);animation:fadeUp .4s}
.auth-step{display:inline-block;font-size:11.5px;font-weight:700;color:var(--brandglow);background:var(--tint);border:1px solid var(--line);padding:3px 12px;border-radius:99px;margin-bottom:14px}
.auth-title{font-size:28px;font-weight:900;margin-bottom:6px}
.auth-sub{color:var(--ink2);font-size:13.5px;margin-bottom:20px}
#appRoot{display:grid;grid-template-columns:302px 1fr;height:100vh}
.sidebar{background:linear-gradient(180deg,var(--sidebar),var(--sidebar2));color:#E9E4F8;display:flex;flex-direction:column;position:relative;z-index:5;border-inline-end:1px solid var(--sidebar-edge);overflow:hidden}
.sidebar::before{content:'';position:absolute;inset:0;background-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='72' height='72' viewBox='0 0 72 72'><g fill='none' stroke='%23ffffff' stroke-opacity='.04'><rect x='16' y='16' width='40' height='40'/><rect x='16' y='16' width='40' height='40' transform='rotate(45 36 36)'/></g></svg>");pointer-events:none}
.side-head{display:flex;align-items:center;gap:10px;padding:16px 14px;border-bottom:1px solid rgba(255,255,255,.09);position:relative;flex:none}
.side-head .badge{width:38px;height:38px;border-radius:11px}
.side-head .badge svg{width:21px;height:21px}
.brand-name{font-weight:900;font-size:19px;line-height:1.3}
.brand-sub{font-size:10.5px;opacity:.8;color:#D8CCFA}
.side-tools{padding:12px 14px;position:relative;flex:none}
.w100{width:100%;justify-content:center}
.tree{flex:1;overflow:auto;padding:4px 10px 14px;position:relative;min-height:0}
.tree-empty{padding:20px 10px;font-size:12.5px;opacity:.65;text-align:center}
.trow{display:flex;align-items:center;gap:6px;padding:7px 8px;border-radius:9px;cursor:pointer;transition:.15s;user-select:none;position:relative}
.trow:hover{background:rgba(255,255,255,.07)}
.trow.sel{background:var(--tint);box-shadow:inset 3px 0 0 var(--glow)}
.twist{width:18px;height:18px;border:none;background:none;color:#B8A8E8;display:grid;place-items:center;cursor:pointer}
.twist svg{width:13px;height:13px;transition:transform .2s;transform:rotate(90deg)}
.twist.open svg{transform:none}
.twist.ph{cursor:default}
.tico{color:rgba(233,228,248,.65)}
.tico svg{width:17px;height:17px}
.trow.sel .tico{color:var(--glow)}
.ttitle{flex:1;min-width:0;overflow-wrap:anywhere;white-space:normal;line-height:1.7;font-size:13.5px}
.tcount{font-size:10.5px;background:rgba(161,140,229,.28);color:#D8CCFA;border-radius:99px;padding:0 7px;font-weight:700;transition:.15s}
.trow:hover .tcount{opacity:0}
.tacts{position:absolute;inset-inline-end:4px;top:3px;bottom:3px;display:flex;gap:1px;align-items:center;opacity:0;transition:.15s;background:var(--veil);padding:0 3px;border-radius:8px}
.trow:hover .tacts{opacity:1}
.tact{width:22px;height:22px;border:none;background:transparent;color:#C9BCEF;border-radius:6px;display:grid;place-items:center;cursor:pointer}
.tact:hover{background:rgba(255,255,255,.14);color:#fff}
.tact.warn:hover{color:#FFB4A8}
.tact svg{width:12.5px;height:12.5px}
.tkids{overflow:hidden}
.appmain{display:flex;flex-direction:column;height:100vh;overflow:hidden}
#topbar{display:flex;align-items:center;gap:12px;padding:10px 18px;background:var(--surface);border-bottom:1px solid var(--line)}
.crumbs{flex:1;display:flex;align-items:center;gap:4px;overflow:hidden;font-size:13px;min-width:0}
.crumb{background:none;border:none;color:var(--ink2);font:600 13px var(--font);cursor:pointer;padding:4px 8px;border-radius:8px}
.crumb:hover{background:var(--elevated);color:var(--ink)}
.crumb.cur{color:var(--ink);font-weight:800;cursor:default;background:var(--elevated)}
.csep{color:var(--ink2);opacity:.6}
.top-actions{display:flex;gap:8px;align-items:center}
.save-ind{font-size:11px;color:var(--ok);opacity:0;transition:opacity .3s;display:inline-flex;gap:5px;align-items:center}
.save-ind.on{opacity:1}
.save-ind svg{width:13px;height:13px}
.theme-inline{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--elevated);color:var(--ink);display:grid;place-items:center;cursor:pointer;transition:.18s}
.theme-inline:hover{background:var(--hover);color:#fff;transform:translateY(-1px)}
.theme-inline svg{width:16px;height:16px}
#mainArea{flex:1;overflow:auto;padding:26px 30px 90px}
#menuBtn{display:none}
#statusDock{position:fixed;right:12px;bottom:12px;z-index:60;pointer-events:none;background:var(--toastbg);border:1px solid var(--toastline);border-radius:12px;padding:8px 14px;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow);color:#F1EEFD;font-size:11px;max-width:250px;backdrop-filter:blur(6px)}
#statusDock .dock-stats{display:flex;gap:10px;flex-wrap:wrap;align-items:center;opacity:.92}
#statusDock .dock-stats span{display:inline-flex;gap:4px;align-items:center}
#statusDock svg{width:12px;height:12px}
#statusDock .dock-time{font-size:19px;font-weight:900;letter-spacing:1px;line-height:1.25}
#statusDock .dock-date{font-size:10.5px;opacity:.8}
.node-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:14px;animation:fadeUp .3s}
.node-title{font-size:34px;font-weight:900;line-height:1.25}
.node-meta{color:var(--ink2);font-size:12.5px}
.node-actions{display:flex;gap:8px;flex-wrap:wrap}
.view-toggle{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--elevated);padding:2px}
.view-toggle button{border:none;background:transparent;color:var(--ink2);padding:6px 10px;cursor:pointer;display:inline-flex;gap:5px;align-items:center;font:600 12px var(--font);border-radius:7px;transition:.15s}
.view-toggle button svg{width:14px;height:14px}
.view-toggle button.active{background:var(--hover);color:#fff}
.view-toggle button:hover:not(.active){color:var(--ink)}
.schema-empty{background:var(--elevated);border:1.5px dashed var(--hover);border-radius:14px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.schema-empty p{font-size:13.5px}
.schema-empty svg{width:15px;height:15px;display:inline-block;vertical-align:-3px}
.rec-toolbar{display:flex;justify-content:flex-start;margin-bottom:14px}
.qfilter{display:flex;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--line);border-radius:11px;padding:0 12px;width:330px;max-width:100%}
.qfilter svg{width:16px;height:16px;color:var(--ink2)}
.qfilter .inp{border:none;box-shadow:none;padding:9px 0;background:transparent}
.qfilter .inp:focus{box-shadow:none}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 16px 12px 12px;position:relative;transition:.2s;animation:fadeUp .4s both}
.rcard::before{content:'';position:absolute;top:14px;bottom:14px;right:0;width:4px;border-radius:4px;background:linear-gradient(180deg,var(--accent),var(--glow))}
.rcard:hover{transform:translateY(-3px);box-shadow:var(--cardhover);border-color:var(--hover)}
.rcard.flash{animation:flash 1.5s}
.rcard-top{display:flex;justify-content:space-between;gap:8px;margin-bottom:6px}
.rtitle{font-size:19px;font-weight:800;line-height:1.5;color:var(--brandglow)}
.racts{display:flex;gap:2px;opacity:.4;transition:.15s}
.rcard:hover .racts{opacity:1}
.rrow{display:flex;gap:10px;padding:7px 0;border-top:1px dashed var(--line);font-size:13px;align-items:flex-start}
.rlab{width:96px;flex:none;color:var(--ink2);font-weight:700;font-size:12px;padding-top:2px}
.rval{flex:1;min-width:0;overflow-wrap:anywhere}
.rthumb{max-width:100%;max-height:170px;border-radius:9px;cursor:zoom-in;border:1px solid var(--line);transition:.2s}
.rthumb:hover{transform:scale(1.015);box-shadow:var(--shadow)}
.imgbtns{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap;align-items:center}
.pdfchip{display:inline-flex;align-items:center;gap:7px;background:var(--softbg);border:1px solid var(--line);border-radius:9px;padding:4px 10px;font-size:12px;max-width:100%;flex-wrap:wrap}
.pdfchip svg{width:15px;height:15px;color:var(--ink2)}
.pdfchip.fc-pdf svg{color:#E4574C}
.pdfchip.fc-word svg{color:#6B8CE4}
.pdfchip.fc-excel svg{color:#4CAF7D}
.pdfchip b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;max-width:170px}
.mini{border:none;background:var(--brand);color:#fff;font:600 11px var(--font);padding:3px 10px;border-radius:7px;cursor:pointer;transition:.15s}
.mini:hover{background:var(--hover)}
.mini.ghost{background:var(--elevated);color:var(--ink)}
.mini.ghost:hover{background:var(--line)}
.rfoot{margin-top:8px;font-size:11px;color:var(--ink2);opacity:.75}
.empty-sub{color:var(--ink2);background:var(--surface);border:1.5px dashed var(--line);border-radius:14px;padding:26px;text-align:center;margin-top:6px}
.home-empty{max-width:640px;margin:40px auto;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:44px;text-align:center;box-shadow:var(--shadow);animation:fadeUp .4s}
.he-ico{width:74px;height:74px;margin:0 auto 16px;border-radius:20px;background:var(--elevated);color:var(--brandglow);display:grid;place-items:center}
.he-ico svg{width:36px;height:36px}
.home-empty h2{font-size:26px;font-weight:900;margin-bottom:6px}
.home-empty p{color:var(--ink2);font-size:13.5px;margin-bottom:18px}
.he-steps{text-align:right;list-style:none;counter-reset:s;margin-top:26px;display:flex;flex-direction:column;gap:8px}
.he-steps li{counter-increment:s;font-size:13px;color:var(--ink2);display:flex;gap:10px;align-items:baseline}
.he-steps li::before{content:counter(s, persian);background:linear-gradient(135deg,var(--accent),var(--hover));color:#fff;width:22px;height:22px;flex:none;border-radius:7px;display:inline-grid;place-items:center;font-weight:800;font-size:12px}
.spanel{max-width:920px;animation:fadeUp .3s}
.spanel-title{font-size:26px;font-weight:900;display:flex;gap:10px;align-items:center;margin-bottom:14px}
.spanel-title svg{width:24px;height:24px;color:var(--brandglow)}
.sgrid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:20px}
.scount{color:var(--ink2);font-size:13px;margin-bottom:12px}
.sres{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 16px;margin-bottom:10px;cursor:pointer;transition:.18s;animation:fadeUp .35s both}
.sres:hover{border-color:var(--hover);box-shadow:var(--cardhover);transform:translateY(-2px)}
.sres-top{display:flex;justify-content:space-between;gap:10px;font-size:11.5px;color:var(--ink2);margin-bottom:5px;flex-wrap:wrap}
.spath{display:inline-flex;gap:4px;align-items:center;color:var(--brandglow);font-weight:700}
.sfield{background:var(--elevated);border-radius:99px;padding:0 9px;font-weight:700}
.ssnip{font-size:13.5px}
.sres-go{margin-top:8px;display:flex}
#modalWrap{position:fixed;inset:0;background:rgba(8,5,16,.55);display:none;place-items:center;z-index:360;padding:20px;backdrop-filter:blur(3px)}
#modalWrap.on{display:grid}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;width:100%;max-width:560px;max-height:90vh;overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.4);animation:pop .22s}
.modal.wide{max-width:760px}
.mhead{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:2}
.mhead h3{font-size:19px;font-weight:800}
.mbody{padding:20px}
.mactions{display:flex;gap:10px;justify-content:flex-start;margin-top:18px;flex-wrap:wrap}
.mactions.spread{justify-content:space-between;align-items:center}
.cmsg{font-size:14px;line-height:2}
.frow{display:grid;grid-template-columns:140px 1fr 140px 34px;gap:8px;margin-bottom:0;align-items:center;animation:fadeUp .25s}
.ff{margin-bottom:15px}
.filebox{border:1.5px dashed var(--line);border-radius:12px;padding:12px;background:var(--softbg)}
.filebtns{display:flex;gap:8px;flex-wrap:wrap}
.fprev{margin-top:10px}
.previmg{max-height:150px;border-radius:9px;border:1px solid var(--line)}
.rform{min-width:0}
.setgrid{display:flex;flex-direction:column;gap:20px}
.setsec{border:1px solid var(--line);border-radius:12px;padding:16px}
.setsec h4{font-size:14.5px;margin-bottom:10px;display:flex;gap:7px;align-items:center}
.setsec h4 svg{width:17px;height:17px;color:var(--brandglow)}
.setsec.danger{border-color:var(--errline);background:var(--errbg)}
.seclist{list-style:none;display:flex;flex-direction:column;gap:7px;font-size:12.5px;color:var(--ink2)}
.seclist li{position:relative;padding-inline-start:16px}
.seclist li::before{content:'';position:absolute;inset-inline-start:0;top:9px;width:7px;height:7px;border-radius:2px;background:var(--accent);transform:rotate(45deg)}
#toastWrap{position:fixed;bottom:20px;left:20px;z-index:400;display:flex;flex-direction:column;gap:8px}
.toast{display:flex;gap:9px;align-items:center;background:var(--toastbg);border:1px solid var(--toastline);color:#F1EEFD;padding:11px 16px;border-radius:12px;box-shadow:0 10px 26px rgba(0,0,0,.35);font-size:13px;animation:toastIn .3s;max-width:340px}
.toast svg{width:16px;height:16px;color:var(--glow)}
.toast.err{background:#5C1A17;border-color:rgba(239,68,68,.4)}
.toast.out{opacity:0;transform:translateY(8px);transition:.3s}
#lightbox{position:fixed;inset:0;background:rgba(8,6,16,.9);display:none;place-items:center;z-index:300;cursor:zoom-out;padding:30px}
#lightbox.on{display:grid}
#lightbox img{max-width:92vw;max-height:90vh;border-radius:12px;box-shadow:0 20px 70px rgba(0,0,0,.6);animation:pop .25s}
#pdfOverlay{position:fixed;inset:0;background:rgba(10,8,18,.95);display:none;flex-direction:column;z-index:320}
#pdfOverlay.on{display:flex}
.pdf-head{display:flex;gap:8px;align-items:center;padding:10px 14px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.pdf-title{font-weight:800;font-size:13px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pdf-body{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;align-items:center;gap:14px;background:#26232b}
.pdf-body canvas{max-width:100%;height:auto;border-radius:6px;box-shadow:0 6px 24px rgba(0,0,0,.5);background:#fff}
.pdf-load{color:#F1EEFD;font-size:14px;margin-top:40px}
#recOverlay{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:240}
#recOverlay.on{display:flex}
.ro-head{display:flex;gap:8px;align-items:center;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.ro-title{font-weight:900;font-size:16px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ro-body{flex:1;overflow:auto;padding:20px;width:100%;max-width:900px;margin:0 auto}
.ro-row{display:flex;gap:14px;padding:12px 4px;border-bottom:1px dashed var(--line);align-items:flex-start}
.ro-row:last-child{border-bottom:none}
.ro-k{flex:0 0 170px;font-weight:800;color:var(--brandglow);font-size:13px}
.ro-v{flex:1;min-width:0;overflow-wrap:anywhere;font-size:14px}
.ro-v img.ro-img{max-width:100%;max-height:320px;border-radius:10px;cursor:zoom-in;border:1px solid var(--line)}
.ro-v audio{width:100%;max-width:420px}
.ro-btns{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
#scrim{display:none}
#printArea{display:none}
.printdlg{display:flex;flex-direction:column;gap:16px}
.pd-row{display:flex;flex-direction:column;gap:8px}
.pd-lab{font-weight:800;font-size:13px;color:var(--brandglow)}
.pd-sigs{display:flex;flex-wrap:wrap;gap:8px 18px;max-height:130px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--softbg)}
.pd-mini{display:flex;gap:8px;margin-top:6px}
.print-preview{max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:10px;background:#d8d8e0;padding:14px}
.print-preview .prdoc{box-shadow:0 6px 22px rgba(0,0,0,.3);min-height:160px}
.prdoc{background:#fff;color:#171421;font-family:'Vazirmatn',Tahoma,sans-serif;padding:22px;font-size:13px;line-height:1.9}
.prdoc .pr-top{border-bottom:3px solid #4C35A3;padding-bottom:10px;margin-bottom:16px}
.prdoc .pr-brand{font-weight:800;font-size:14px;color:#4C35A3}
.prdoc .pr-top h1{font-size:22px;font-weight:900;color:#171421}
.prdoc .pr-meta{font-size:11px;color:#555}
.prdoc .pr-path{font-size:14px;background:#F0ECFF;border-inline-start:4px solid #4C35A3;padding:5px 12px;margin:14px 0 8px;border-radius:6px;color:#171421}
.prdoc .pr-rec{break-inside:avoid;margin-bottom:12px}
.prdoc .pr-rt{font-weight:800;font-size:13px;margin-bottom:4px;color:#4C35A3}
.prdoc table{width:100%;border-collapse:collapse}
.prdoc td,.prdoc th{border:1px solid #D9D3EA;padding:5px 9px;font-size:12px;vertical-align:top;color:#171421}
.prdoc th{background:#F0ECFF;font-weight:800;text-align:right}
.prdoc .pr-k{width:160px;background:#F0ECFF;font-weight:700}
.prdoc .pr-num{width:40px;text-align:center;color:#555}
.prdoc .pr-img{max-height:120px;max-width:240px}
.prdoc .pr-foot{margin-top:18px;font-size:11px;color:#666;border-top:1px solid #ccc;padding-top:8px}
@media print{
@page{margin:13mm}
body{background:#fff!important}
#appRoot,#authScreen,#modalWrap,#toastWrap,#lightbox,#pdfOverlay,#recOverlay,#statusDock,#remWrap,#scrim{display:none!important}
#printArea{display:block!important}
#printArea .prdoc{padding:0;box-shadow:none}
}
.rtable-wrap{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:auto;animation:fadeUp .3s;height:calc(100vh - 330px);min-height:300px}
.rtable{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed}
.rtable th{position:sticky;top:0;background:var(--elevated);color:var(--brandglow);font-weight:800;text-align:right;padding:10px 12px;border-bottom:2px solid var(--line);white-space:nowrap;z-index:2;overflow:hidden;text-overflow:ellipsis}
.rtable th svg{width:14px;height:14px;display:inline-block;vertical-align:-3px;margin-inline-end:3px}
.rtable td{padding:9px 12px;border-bottom:1px dashed var(--line);vertical-align:top;overflow:hidden}
.rtable tr:hover td{background:var(--tint-row)}
.rtable tr:last-child td{border-bottom:none}
.rtable .col-num{width:44px;text-align:center;color:var(--ink2);font-weight:700}
.rtable th.col-sel,.rtable td.col-sel{min-width:36px;width:36px}
.rtable .gripcol{width:34px}
.rtable .col-acts{width:160px;text-align:center;white-space:nowrap}
.rtable .col-acts .iconbtn{display:inline-grid}
.rtable .mini{padding:2px 8px;font-size:10.5px}
.rtable .rthumb{max-height:80px;max-width:120px}
.rtable .pdfchip{font-size:11px;padding:2px 8px;max-width:100%}
.rtable .pvdots{font-size:12px;padding:1px 8px;max-width:120px}

function _jdiv(a,b){return ~~(a/b);}
function _jmod(a,b){return a-~~(a/b)*b;}
function _jalCal(jy){
const breaks=[-61,9,38,199,426,686,756,818,1111,2061,2672,3301,3772,4127,4409,4759,5024,5443,5621,5905,6003,6171,6189,6251,6339,6417,6472,6527,6625,6663,6707,6771,6821,6887,6949,7003,7081,7131,7221,7281,7337,7385,7439,7491,7545,7581,7639,7687,7719];
let leapJ=-14,jp=breaks[0],jump=0;const gy=jy+621;
for(let i=1;i<breaks.length;i++){
const jm=breaks[i];jump=jm-jp;
if(jy<jm)break;
leapJ=leapJ+_jdiv(jump,33)*8+_jdiv(_jmod(jump,33),4);jp=jm;
}
let n=jy-jp;
leapJ=leapJ+_jdiv(n,33)*8+_jdiv(_jmod(n,33)+3,4);
if(_jmod(jump,33)===4&&jump-n===4)leapJ++;
const leapG=_jdiv(gy,4)-_jdiv((_jdiv(gy,100)+1)*3,4)-150;
const march=20+leapJ-leapG;
if(jump-n<6)n=n-jump+_jdiv(jump+4,33)*33;
let leap=_jmod(_jmod(n+1,33)-1,4);
if(leap===-1)leap=4;
return {leap:leap,gy:gy,march:march};
}
function _g2d(gy,gm,gd){
let d=_jdiv((gy+_jdiv(gm-8,6)+100100)*1461,4)+_jdiv(153*_jmod(gm+9,12)+2,5)+gd-34840408;
d=d-_jdiv(_jdiv(gy+100100+_jdiv(gm-8,6),100)*3,4)+752;
return d;
}
function _d2g(jdn){
let j=4*jdn+139361631;
j=j+_jdiv(_jdiv(4*jdn+183187720,146097)*3,4)*4-3908;
const i=_jdiv(_jmod(j,1461),4)*5+308;
const gd=_jdiv(_jmod(i,153),5)+1;
const gm=_jmod(_jdiv(i,153),12)+1;
const gy=_jdiv(j,1461)-100100+_jdiv(8-gm,6);
return {gy:gy,gm:gm,gd:gd};
}
function _j2d(jy,jm,jd){
const r=_jalCal(jy);
return _g2d(r.gy,3,r.march)+(jm-1)*31-_jdiv(jm,7)*(jm-7)+jd-1;
}
function _d2j(jdn){
const gy=_d2g(jdn).gy;
let jy=gy-621;
const r=_jalCal(jy);
const jdn1f=_g2d(gy,3,r.march);
let k=jdn-jdn1f,jm,jd;
if(k>=0){
if(k<=185){jm=1+_jdiv(k,31);jd=_jmod(k,31)+1;return {jy:jy,jm:jm,jd:jd};}
k-=186;
}else{
jy-=1;k+=179;
if(r.leap===1)k+=1;
}
jm=7+_jdiv(k,30);jd=_jmod(k,30)+1;
return {jy:jy,jm:jm,jd:jd};
}
function j2g(jy,jm,jd){return _d2g(_j2d(jy,jm,jd));}
function g2j(gy,gm,gd){return _d2j(_g2d(gy,gm,gd));}

async function deriveKey(pass,salt,iters){

}

async function openBank(id,pass){
await stOpen(id);
const payload=await stGetVault(id);
if(payload&&payload.salt){
const salt=b64ToBuf(payload.salt);
const it=payload.iters||210000;
const k=await deriveKey(pass,salt,it);
const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64ToBuf(payload.iv)},k,b64ToBuf(payload.ct));
const obj=JSON.parse(new TextDecoder().decode(pt));
SALT=salt;KEY=k;KEY_ITERS=it;VAULT=payload;DB=obj;MASTER_PASS=pass;ACTIVE_ID=id;
}else{
const salt=crypto.getRandomValues(new Uint8Array(16));
const k=await deriveKey(pass,salt,PBKDF2_NEW);
SALT=salt;KEY=k;KEY_ITERS=PBKDF2_NEW;VAULT=null;DB=emptyBankDB();MASTER_PASS=pass;ACTIVE_ID=id;
await doSave();
}
REG.lastActive=id; await stSaveReg();

async function migrateLegacy(pass){
const payload = USE_SERVER ? await (await fetch('/api/legacy')).json() : await legacyGet();
if(!payload) return false;
const k=await deriveKey(pass,b64ToBuf(payload.salt),210000);
const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64ToBuf(payload.iv)},k,b64ToBuf(payload.ct));
const full=JSON.parse(new TextDecoder().decode(pt));
if(!full||!full.banks) return false;
for(const bid of Object.keys(full.banks)){
const b=full.banks[bid];
const nid=uid();
await stCreateBank(nid,b.name||'بانک');
const bankDB={v:1,nodes:b.nodes||{},root:b.root||[],records:b.records||{},settings:full.settings||{autoLockMin:5},meta:{created:b.created||Date.now()}};
const salt=crypto.getRandomValues(new Uint8Array(16));
const kk=await deriveKey(pass,salt,PBKDF2_NEW);
const iv=crypto.getRandomValues(new Uint8Array(12));
const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},kk,new TextEncoder().encode(JSON.stringify(bankDB)));
await stSetVault(nid,{v:1,iters:PBKDF2_NEW,salt:bufToB64(salt),iv:bufToB64(iv),ct:bufToB64(ct)});
}
BANKS=REG.banks.slice();
if(USE_SERVER){ await fetch('/api/legacy/done',{method:'POST'}); } else { await legacyDel(); }
return true;
}

async function startRec(fid,btn){
if(REC.rec){toast('یک ضبط دیگر در جریان است','warn');return;}

try{
const stream=await navigator.mediaDevices.getUserMedia({audio:true});
const mrec=new MediaRecorder(stream);
const chunks=[];
mrec.ondataavailable=ev=>{if(ev.data&&ev.data.size)chunks.push(ev.data);};
mrec.onstop=()=>{
try{stream.getTracks().forEach(t=>t.stop());}catch(e){}
if(REC.timer)clearInterval(REC.timer);
const st=$('#rec_'+fid);if(st)st.hidden=true;
if(btn){btn.disabled=false;btn.classList.remove('recording');}
REC={stream:null,rec:null,timer:null,start:0,fid:null,btn:null};
const blob=new Blob(chunks,{type:mrec.mimeType||'audio/webm'});
if(!blob.size){toast('ضبط خالی بود','warn');return;}
const reader=new FileReader();
reader.onload=()=>{
const obj={name:'ضبط-صدا-'+new Date().toISOString().slice(0,16).replace(/[:T]/g,'-')+extFromMime(blob.type),mime:blob.type||'audio/webm',size:blob.size,data:reader.result};

toast('صدا ضبط شد؛ برای ثبت نهایی دکمه «ثبت رکورد» را بزنید');
};
reader.readAsDataURL(blob);
};
mrec.start();
REC={stream:stream,rec:mrec,timer:null,start:Date.now(),fid:fid,btn:btn};
btn.disabled=true;btn.classList.add('recording');
const st=$('#rec_'+fid);
if(st){st.hidden=false;const tEl=st.querySelector('.rectime');REC.timer=setInterval(()=>{const s=Math.floor((Date.now()-REC.start)/1000);if(tEl)tEl.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');},500);}
}catch(err){toast('دسترسی به میکروفن ممکن نشد؛ اجازه میکروفن را بدهید یا از «انتخاب فایل صدا» استفاده کنید','err');}
}

function sortByField(n,f){

else SORT.dir*=-1;
const arr=DB.records[n.id]=DB.records[n.id]||[];
const isNum=(f.type==='number'||f.type==='money'||f.type==='calc');
const val=r=>{const v=r.values[f.id];if(v==null||v==='')return null;if(typeof v==='object')return v.name||'';return v;};
arr.sort((a,b)=>{
let x=val(a),y=val(b);
if(x==null&&y==null)return 0;if(x==null)return 1;if(y==null)return -1;
if(isNum){x=parseFloat(x);y=parseFloat(y);if(isNaN(x))x=-Infinity;if(isNaN(y))y=-Infinity;return (x-y)*SORT.dir;}
x=norm(String(x));y=norm(String(y));
let c;try{c=x.localeCompare(y,'fa');}catch(e){c=x<y?-1:x>y?1:0;}
return (c||0)*SORT.dir;
});

function typeIn(ft,filter){if(filter==='all')return true;if(filter==='text')return ft==='text'||ft==='longtext';return ft===filter;}
function searchStr(v){if(typeof v==='boolean')return v?'انجام شده':'انجام نشده';return typeof v==='object'?(v&&v.name?String(v.name):''):String(v);}
function snipMark(text,q){
const nt=norm(text);const i=nt.indexOf(q);
if(i<0)return esc(text).slice(0,140);
const s=Math.max(0,i-38),e=Math.min(nt.length,i+q.length+48);
const parts=nt.substring(s,e).split(q);
return (s>0?'…':'')+parts.map(esc).join('<mark>'+esc(q)+'</mark>')+(e<nt.length?'…':'');
}
function runSearch(){
const qEl=$('#sq');if(!qEl)return;
ui.search={q:qEl.value,match:$('#smatch').value,scope:$('#sscope').value,type:$('#stype').value,done:true};
const q=norm(ui.search.q);
const nodeIds=(ui.search.scope==='sub'&&ui.sel&&DB.nodes[ui.sel])?subtreeIds(ui.sel):Object.keys(DB.nodes);
const res=[];
nodeIds.forEach(nid=>{
const n=DB.nodes[nid];if(!n)return;
(DB.records[nid]||[]).forEach(r=>{
n.fields.forEach(f=>{
if(f.type==='password')return;
if(!typeIn(f.type,ui.search.type))return;
const v=r.values[f.id];
if(v==null||v==='')return;
const sval=norm(searchStr(v));
if(!q){res.push({nid:nid,rid:r.id,fid:f.id,snip:esc(searchStr(v)).slice(0,140)});}
else if(ui.search.match==='exact'?sval===q:sval.includes(q)){res.push({nid:nid,rid:r.id,fid:f.id,snip:snipMark(searchStr(v),q)});}
});
});
});
ui.results=res;
renderMain();
}

function ensureLib(key){
const L=LIBS[key];
if(L.ok())return Promise.resolve(true);
if(!L.p){
L.p=new Promise(res=>{
const s=document.createElement('script');
s.src=L.src;
const to=setTimeout(()=>res(false),20000);
s.onload=()=>{clearTimeout(to);res(!!L.ok());};
s.onerror=()=>{clearTimeout(to);res(false);};
document.head.appendChild(s);
}).then(r=>{L.p=null;return r;});
}
return L.p;
}

async function renderPdf(v){
try{
const ok=await ensureLib('pdfjs');
if(!ok||!window.pdfjsLib)throw 0;
window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const u8=dataURLtoU8(v.data);
const pdf=await window.pdfjsLib.getDocument({data:u8}).promise;
PDFDOC=pdf;
$('#pdfPages').textContent=faNum(pdf.numPages)+' صفحه';
await paintPages(pdf);
}catch(e){
closePdfOverlay();
toast('نمایش داخل برنامه ممکن نشد؛ با نمایشگر ویندوز باز می‌کنم','warn');
if(window.bayganBridge)window.bayganBridge.openWithSystem(v.data,v.name||'file.pdf');
}

async function paintPages(pdf){
const body=$('#pdfBody');body.innerHTML='';
for(let p=1;p<=pdf.numPages;p++){
const page=await pdf.getPage(p);
const vp=page.getViewport({scale:PDFSCALE});
const canvas=document.createElement('canvas');
canvas.width=Math.floor(vp.width);canvas.height=Math.floor(vp.height);
const ctx=canvas.getContext('2d');
await page.render({canvasContext:ctx,viewport:vp}).promise;
body.appendChild(canvas);
}
}

let REM_TIMER=null,REM_QUEUE=[],REM_SNOOZE={},REM_ACTX=null,REM_BEEP=null,REM_FIRED=null;
function remFiredMap(){
if(REM_FIRED)return REM_FIRED;
try{REM_FIRED=JSON.parse(localStorage.getItem('baygan-remfired')||'{}');}catch(e){REM_FIRED={};}
const cutoff=Date.now()-30*86400000;
Object.keys(REM_FIRED).forEach(k=>{if(REM_FIRED[k]<cutoff)delete REM_FIRED[k];});
return REM_FIRED;
}
function collectReminders(){
const out=[];
Object.keys(DB.nodes).forEach(nid=>{
const n=DB.nodes[nid];if(!n)return;
(n.fields||[]).forEach(f=>{
if(f.type!=='reminder')return;
(DB.records[nid]||[]).forEach(r=>{
const v=r.values[f.id];
if(v==null||v==='')return;
const dt=parseRem(v);if(!dt)return;
out.push({nid:nid,rid:r.id,fid:f.id,ts:dt.getTime(),title:cardTitle(n,r),label:f.label||'یادآوری',cal:f.cal||'g',raw:v});
});
});
});
return out;
}
function reminderKey(x){return x.nid+':'+x.rid+':'+x.fid+':'+x.raw;}
function startReminders(){stopReminders();checkReminders();REM_TIMER=setInterval(checkReminders,15000);}
function stopReminders(){if(REM_TIMER){clearInterval(REM_TIMER);REM_TIMER=null;}}
function checkReminders(){
if(!DB)return;
const now=Date.now();const fired=remFiredMap();
const due=[];
Object.keys(REM_SNOOZE).forEach(k=>{
if(REM_SNOOZE[k].ts<=now){due.push(REM_SNOOZE[k].x);delete REM_SNOOZE[k];}
});
collectReminders().forEach(x=>{
if(x.ts>now+5000)return;
const k=reminderKey(x);
if(fired[k])return;
fired[k]=now;
try{localStorage.setItem('baygan-remfired',JSON.stringify(fired));}catch(e){}
due.push(x);
});
due.forEach(x=>{REM_QUEUE.push(x);});
if(REM_QUEUE.length&&!$('#remWrap').classList.contains('on'))showNextReminder();
}
function showNextReminder(){
if(!REM_QUEUE.length)return;
const x=REM_QUEUE[0];
remNotify(x);
startAlarmSound();
const overdue=x.ts<Date.now()-60000;
const wrap=$('#remWrap');
wrap.innerHTML='<div class="rembox"><span class="rembell">'+I.bell+'</span>'
+'<h3>یادآوری: '+esc(x.label)+'</h3>'
+'<div class="remrec">'+esc(x.title)+'</div>'
+'<div class="remdt">'+fmtReminder(x.raw,x.cal)+'</div>'
+(overdue?'<div class="hint">این زمان گذشته است</div>':'')
+'<div class="mactions" style="justify-content:center;margin-top:12px"><button class="btn btn-ghost" id="remSnooze">۱۵ دقیقه دیگر</button><button class="btn btn-accent" id="remStop">بی‌صدا</button></div></div>';
wrap.classList.add('on');
$('#remStop').onclick=()=>remDismiss(false);
$('#remSnooze').onclick=()=>{REM_SNOOZE[reminderKey(x)]={ts:Date.now()+15*60000,x:x};remDismiss(true);toast('یادآوری ۱۵ دقیقه دیگر تکرار می‌شود');};

function remDismiss(){

function startAlarmSound(){
stopAlarmSound();
try{
if(!REM_ACTX)REM_ACTX=new (window.AudioContext||window.webkitAudioContext)();
if(REM_ACTX.state==='suspended')REM_ACTX.resume();
const ctx=REM_ACTX;let i=0;
REM_BEEP=setInterval(()=>{
try{
const o=ctx.createOscillator(),g=ctx.createGain();
o.type='sine';o.frequency.value=(i++%2)?660:880;
g.gain.setValueAtTime(0.0001,ctx.currentTime);
g.gain.exponentialRampToValueAtTime(0.28,ctx.currentTime+0.03);
g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+0.55);
o.connect(g);g.connect(ctx.destination);
o.start();o.stop(ctx.currentTime+0.6);
}catch(e){}
},900);
}catch(e){}
}
function stopAlarmSound(){if(REM_BEEP){clearInterval(REM_BEEP);REM_BEEP=null;}}

const QPKEY='baygan-quickpin';let qpFails=0;
function qpRead(){try{return JSON.parse(localStorage.getItem(QPKEY)||'null');}catch(e){return null;}}
function canQuickPin(){
const qp=qpRead();
return !!(qp&&qp.salt&&qp.iv&&qp.ct&&BANKS.length&&REG.lastActive&&BANKS.some(b=>b.id===REG.lastActive));
}
async function enableQuickPin(pin){
const salt=crypto.getRandomValues(new Uint8Array(16));
const iv=crypto.getRandomValues(new Uint8Array(12));
const key=await deriveKey(pin,salt,200000);
const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},key,new TextEncoder().encode(MASTER_PASS));
try{localStorage.setItem(QPKEY,JSON.stringify({v:1,iters:200000,salt:bufToB64(salt),iv:bufToB64(iv),ct:bufToB64(ct)}));}catch(e){throw new Error('storage');}
}
async function qpMaster(pin){
const qp=qpRead();if(!qp)throw new Error('no-pin');
const key=await deriveKey(pin,b64ToBuf(qp.salt),qp.iters||200000);
const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64ToBuf(qp.iv)},key,b64ToBuf(qp.ct));
return new TextDecoder().decode(pt);
}

function cellText(f,v){
if(v==null||v==='')return '';
if(f.type==='check')return isDone(v)?'انجام شده':'انجام نشده';
if(typeof v==='object')return (v.name||'')+(v.size?' ('+fmtSize(v.size)+')':'');
if(f.type==='date')return fmtDateField(v,f.cal||'g');
if(f.type==='reminder')return fmtReminder(v,f.cal||'g');
return String(v);
}
function safeSheetName(s,i){
let t=String(s||'').replace(/[\\\/\?\*\[\]:]/g,'-').trim().slice(0,26);
if(!t)t='برگه';
return t+'-'+(i+1);
}
function csvDownload(g,fname){
const cols=g.node.fields||[];
const q=s=>'"'+String(s==null?'':s).replace(/"/g,'""')+'"';
const lines=[['#','شاخه'].concat(cols.map(f=>f.label+(f.type==='money'&&f.unit?' ('+f.unit+')':''))).map(q).join(',')];
g.records.forEach((r,i)=>{
lines.push([String(i+1),g.path].concat(cols.map(f=>{
const v=r.values[f.id];
if(v==null||v===''||f.type==='password')return '';
if(f.type==='calc'){const rv=calcResult(g.node,f,fid=>r.values[fid]);return rv!=null?String(rv):'';}
if(f.type==='number'||f.type==='money')return String(v);
return cellText(f,v);
})).map(q).join(','));
});
const blob=new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});
const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fname;a.click();
setTimeout(()=>URL.revokeObjectURL(a.href),3000);
toast('فایل CSV دانلود شد؛ برای خروجی اکسل کامل، یک‌بار با اینترنت وصل امتحان کنید','warn');
}

function sigOf(f){return f.type+'|'+f.label;}
function collectSigs(groups){
const seen=[];const set={};
groups.forEach(g=>(g.node.fields||[]).forEach(f=>{
const s=sigOf(f);
if(!set[s]){set[s]=1;const ism=f.type==='money'||(f.type==='calc'&&calcIsMoney(g.node,f));seen.push({sig:s,label:f.label,type:f.type,unit:(ism?(f.type==='calc'?calcUnit(g.node,f):f.unit):'')||'',ismoney:ism});}
}));
return seen;
}
function printCell(f,v,node,r){
if(f.type==='calc'){
const rv=(node&&r)?calcResult(node,f,fid=>r.values[fid]):null;
const show=(rv!=null)?rv:v;
if(show==null||show==='')return '—';
return fmtMoney(show)+((node&&calcIsMoney(node,f))?' '+esc(calcUnit(node,f)):'');
}
if(v==null||v==='')return (f.type==='number')?'':'—';
if(f.type==='password')return '••••••••••';
if(f.type==='check')return isDone(v)?'انجام شده ✔':'انجام نشده ✘';
if(typeof v==='object'){
if(f.type==='image')return '<img class="pr-img" src="'+v.data+'">';
return 'پیوست: '+esc(v.name);
}
if(f.type==='date')return fmtDateField(v,f.cal||'g');
if(f.type==='reminder')return fmtReminder(v,f.cal||'g');
if(f.type==='time')return fmtTimeField(v);
if(f.type==='money')return fmtMoney(v)+' '+esc(f.unit||'');
return esc(String(v)).replace(/\n/g,'<br>');
}
function buildPrintHTML(title,groups,opts){
const checked=opts.checked||{};
const layout=opts.layout||'full';
let total=0;
let h='<div class="prdoc">';
h+='<div class="pr-top"><div class="pr-brand">بایگانی اطلاعات</div><h1>'+esc(title)+'</h1><div class="pr-meta">'
+new Date().toLocaleDateString('fa-IR',{year:'numeric',month:'long',day:'numeric'})+' — ساعت '+new Date().toLocaleTimeString('fa-IR')+'</div></div>';
groups.forEach(g=>{
if(!g.records.length)return;
const cols=(g.node.fields||[]).filter(f=>checked[sigOf(f)]);
h+='<div class="pr-path">'+esc(g.path)+'</div>';
if(layout==='table'){
const sumCols=cols.filter(f=>(f.type==='money'||f.type==='number'||f.type==='calc')&&opts.sumcol&&opts.sumcol[sigOf(f)]);
let foot='';
if(sumCols.length){
const sums={};
sumCols.forEach(f=>{let s=0,c=0;g.records.forEach(r=>{const x=recNum(g.node,f,r);if(x!=null){s+=x;c++;}});sums[f.id]={s:s,c:c};});
foot='<tfoot><tr><td class="pr-num">جمع</td>'+cols.map(f=>{
const x=sums[f.id];
if(!x)return '<td></td>';
const fu=f.type==='calc'?calcUnit(g.node,f):f.unit;
return '<td><b>'+fmtMoney(x.s)+'</b>'+(fu?' '+esc(fu):'')+(x.c<g.records.length?' <span style="font-weight:400">('+faNum(x.c)+' مقدار)</span>':'')+'</td>';
}).join('')+'</tr></tfoot>';
}
h+='<table class="pr-table"><thead><tr><th class="pr-num">#</th>'+cols.map(f=>'<th>'+esc(f.label)+(f.type==='money'&&f.unit?' ('+esc(f.unit)+')':'')+'</th>').join('')+'</tr></thead><tbody>';
g.records.forEach((r,i)=>{
total++;
h+='<tr><td class="pr-num">'+faNum(i+1)+'</td>'+cols.map(f=>'<td>'+printCell(f,r.values[f.id],g.node,r)+'</td>').join('')+'</tr>';
});
h+='</tbody>'+foot+'</table>';
}else{
g.records.forEach(r=>{
total++;
const rows=cols.map(f=>'<tr><td class="pr-k">'+esc(f.label)+'</td><td>'+printCell(f,r.values[f.id],g.node,r)+'</td></tr>').join('');
h+='<div class="pr-rec"><div class="pr-rt">'+esc(cardTitle(g.node,r))+'</div>'+(rows?'<table>'+rows+'</table>':'')+'</div>';
});
}
});
h+='<div class="pr-foot">تعداد رکوردها: '+faNum(total)+' · تولیدشده توسط «بایگانی اطلاعات»</div></div>';
return h;
}

let DRAG_RID=null;
document.addEventListener('dragstart',e=>{
const tr=e.target&&e.target.closest?e.target.closest('tr[draggable="true"]'):null;
if(!tr)return;
DRAG_RID=tr.dataset.rid;tr.classList.add('dragging');
if(e.dataTransfer){e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',DRAG_RID);}catch(_){}}
});
document.addEventListener('dragover',e=>{
if(!DRAG_RID)return;
const tr=e.target&&e.target.closest?e.target.closest('tr[draggable="true"]'):null;
if(!tr||tr.dataset.rid===DRAG_RID)return;
e.preventDefault();
const drag=document.querySelector('tr.dragging');
if(!drag||!tr.parentNode||tr.parentNode!==drag.parentNode)return;
const rect=tr.getBoundingClientRect();
const before=(e.clientY-rect.top)<rect.height/2;
tr.parentNode.insertBefore(drag,before?tr:tr.nextSibling);
});
document.addEventListener('dragend',()=>{
if(!DRAG_RID)return;
const drag=document.querySelector('tr.dragging');
if(drag)drag.classList.remove('dragging');
const table=drag?drag.closest('table'):null;
if(table&&DB){
const nid=table.dataset.nid;
const order=[].slice.call(table.querySelectorAll('tbody tr')).map(tr=>tr.dataset.rid);
const arr=DB.records[nid]||[];
const map={};arr.forEach(r=>{map[r.id]=r;});
const newArr=order.map(id=>map[id]).filter(Boolean);
arr.forEach(r=>{if(order.indexOf(r.id)===-1)newArr.push(r);});
DB.records[nid]=newArr;
SORT={nid:null,fid:null,dir:1,orig:null};
save();renderMain();
toast('ترتیب ردیف‌ها ذخیره شد');
}
DRAG_RID=null;
});
